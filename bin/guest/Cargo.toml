[workspace.package]
[package]
name = "reth"
description = ""
edition = "2021"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
embed-bitcode = true
debug = true

[dependencies]
bincode = "1.3.3"

# workspace
guest-executor = { path = "../../crates/executor/guest" }

# Ziren
zkm-zkvm = { git = "https://github.com/ProjectZKM/Ziren", branch = "perf/glv-msm" }
# zkm-zkvm = { path = "../../../Ziren/crates/zkvm/entrypoint" }

# Statically turns off logging
log = { version = "0.4", features = ["max_level_off", "release_max_level_off"] }
tracing = { version = "0.1", features = ["max_level_off", "release_max_level_off"] }

[patch.crates-io]
ruint = { git = "https://github.com/ziren-patches/ruint", branch = "patch-1.17.0" }
revm = { git = "https://github.com/ziren-patches/revm", branch = "patch-31.0.2-mips32-dispatch" }
revm-bytecode = { git = "https://github.com/ziren-patches/revm", branch = "patch-31.0.2-mips32-dispatch" }
revm-context = { git = "https://github.com/ziren-patches/revm", branch = "patch-31.0.2-mips32-dispatch" }
revm-context-interface = { git = "https://github.com/ziren-patches/revm", branch = "patch-31.0.2-mips32-dispatch" }
revm-database = { git = "https://github.com/ziren-patches/revm", branch = "patch-31.0.2-mips32-dispatch" }
revm-database-interface = { git = "https://github.com/ziren-patches/revm", branch = "patch-31.0.2-mips32-dispatch" }
revm-handler = { git = "https://github.com/ziren-patches/revm", branch = "patch-31.0.2-mips32-dispatch" }
revm-inspector = { git = "https://github.com/ziren-patches/revm", branch = "patch-31.0.2-mips32-dispatch" }
revm-interpreter = { git = "https://github.com/ziren-patches/revm", branch = "patch-31.0.2-mips32-dispatch" }
revm-precompile = { git = "https://github.com/ziren-patches/revm", branch = "patch-31.0.2-mips32-dispatch" }
revm-primitives = { git = "https://github.com/ziren-patches/revm", branch = "patch-31.0.2-mips32-dispatch" }
revm-state = { git = "https://github.com/ziren-patches/revm", branch = "patch-31.0.2-mips32-dispatch" }
# Precompile patches, and the revm workspace with its 32-bit interpreter
# fast paths (gas, stack exchange, memory words) and cheaper jumps (JUMPDEST
# folded into the jump, PUSH2 + JUMP / JUMPI run as one instruction).
sha2 = { git = "https://github.com/ziren-patches/RustCrypto-hashes", branch = "patch-sha2-0.10.9", package = "sha2" }
bn = { git = "https://github.com/ziren-patches/bn", branch = "patch-0.6.0", package = "substrate-bn" }
k256 = { git = "https://github.com/ziren-patches/elliptic-curves", branch = "patch-k256-0.13.4" }
p256 = { git = "https://github.com/ziren-patches/elliptic-curves", branch = "patch-p256-0.13.2" }
alloy-primitives-v1-4-1 = { git = "https://github.com/ziren-patches/core.git", package = "alloy-primitives", branch = "patch-alloy-primitives-1.4.1-hasher" }

# The guest's zkvm crates come from the canonical Ziren checkout next to this
# repo, the same way the GPU prover consumes it; check it out at the Ziren
# branch the dependencies above name.  Every zkm-zkvm / zkm-lib in the graph
# (the precompile patches declare their own, unbranched, and cargo cannot
# redirect a git source to another branch of the same URL) resolves to this
# one source, so there is exactly one global allocator and the word-wise
# memcmp / zero-copy keccak reach every caller.
[patch."https://github.com/ProjectZKM/Ziren"]
zkm-zkvm = { path = "../../../Ziren/crates/zkvm/entrypoint" }
zkm-lib = { path = "../../../Ziren/crates/zkvm/lib" }
